<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="regular">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APAR FinanceOS — AP/AR Operations Console</title>
  <style>
/* ============================================================
   FINANCE OS — Colors & Type
   Design tokens for the Finance OS brand.
   Brand: cinematic, premium, editorial. Dark-first.
   ------------------------------------------------------------
   NOTE ON TYPE: the organization's production typeface is served via
   their (Squarespace) CSS and could not be extracted. The closest
   premium grotesque — HANKEN GROTESK — is substituted here and
   flagged. Replace the @font-face files in /fonts to swap in the
   real brand font without touching the rest of the system.
   ============================================================ */

/* ---------- Webfonts ---------- */
@font-face{font-family:"Hanken Grotesk";font-weight:300;font-style:normal;font-display:swap;src:url("fonts/hanken-300.woff2") format("woff2");}
@font-face{font-family:"Hanken Grotesk";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/hanken-400.woff2") format("woff2");}
@font-face{font-family:"Hanken Grotesk";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/hanken-500.woff2") format("woff2");}
@font-face{font-family:"Hanken Grotesk";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/hanken-600.woff2") format("woff2");}
@font-face{font-family:"Hanken Grotesk";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/hanken-700.woff2") format("woff2");}
@font-face{font-family:"Geist Mono";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/geistmono-400.woff2") format("woff2");}
@font-face{font-family:"Geist Mono";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/geistmono-500.woff2") format("woff2");}

:root{
  /* ---------- BASE COLOR PALETTE ---------- */
  /* Ink / dark surfaces (the brand lives in near-black) */
  --ink-900:#0A0A0B;   /* page background */
  --ink-800:#101012;   /* raised section */
  --ink-700:#161618;   /* card / surface */
  --ink-600:#1F1F22;   /* elevated card, input */
  --ink-500:#2A2A2E;   /* hover surface */
  --ink-400:#3A3A40;   /* hairline on dark, disabled */

  /* Light / paper surfaces (warm off-white for light sections) */
  --paper-0:#FFFFFF;
  --paper-50:#F6F3EE;  /* warm paper */
  --paper-100:#ECE7DF; /* warm card */

  /* Neutral text on dark */
  --white:#FFFFFF;
  --fg-1:rgba(255,255,255,1);     /* primary text */
  --fg-2:rgba(255,255,255,0.66);  /* secondary text */
  --fg-3:rgba(255,255,255,0.42);  /* tertiary / captions */
  --fg-4:rgba(255,255,255,0.24);  /* faint / placeholder */

  /* Text on paper */
  --on-paper-1:#0A0A0B;
  --on-paper-2:rgba(10,10,11,0.62);
  --on-paper-3:rgba(10,10,11,0.40);

  /* Hairlines & borders */
  --line:rgba(255,255,255,0.10);
  --line-strong:rgba(255,255,255,0.18);
  --line-paper:rgba(10,10,11,0.12);

  /* ---------- SIGNATURE ACCENT ---------- */
  /* The "Recognition" gradient: warm coral -> electric indigo.
     Sampled from the brand's capability cards. */
  --coral:#FF8861;
  --coral-bright:#FF9A78;
  --indigo:#5F59FF;
  --indigo-deep:#4A44E0;
  --violet:#9A6BF0;    /* gradient midpoint */
  --grad-recognition:linear-gradient(135deg,#FF8861 0%,#9A6BF0 52%,#5F59FF 100%);
  --grad-recognition-rev:linear-gradient(135deg,#5F59FF 0%,#9A6BF0 48%,#FF8861 100%);
  /* Soft radial glow used behind dark hero content */
  --glow-warm:radial-gradient(60% 60% at 50% 40%,rgba(255,136,97,0.18),transparent 70%);

  /* ---------- SEMANTIC STATUS ---------- */
  --success:#5BC98C;
  --warning:#F0B450;
  --danger:#F26A5A;
  --info:#5F59FF;

  /* ---------- ELEVATION / SHADOW ---------- */
  --shadow-sm:0 1px 2px rgba(0,0,0,0.40);
  --shadow-md:0 8px 24px rgba(0,0,0,0.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,0.55);
  --shadow-glow:0 0 0 1px rgba(255,255,255,0.06),0 20px 50px rgba(95,89,255,0.18);

  /* ---------- RADII ---------- */
  --r-xs:6px;
  --r-sm:10px;
  --r-md:16px;   /* default card / button */
  --r-lg:24px;   /* large cards, the capability tiles */
  --r-xl:32px;
  --r-pill:999px;

  /* ---------- SPACING (4px base) ---------- */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px;
  --s-6:32px; --s-7:48px; --s-8:64px; --s-9:96px; --s-10:128px;

  /* ---------- TYPE ---------- */
  --font-sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;

  /* Fluid display sizes (the site favours large, light, sentence-case heads) */
  --t-display:clamp(48px,6.5vw,104px);  /* hero */
  --t-h1:clamp(36px,4.4vw,68px);
  --t-h2:clamp(28px,3vw,46px);
  --t-h3:clamp(22px,2vw,30px);
  --t-h4:20px;
  --t-body-lg:19px;
  --t-body:16px;
  --t-sm:14px;
  --t-xs:12.5px;
  --t-eyebrow:13px;  /* uppercase label */
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Use these classes (or copy the rules) for consistent type.
   ============================================================ */
.m-display{
  font-family:var(--font-sans);font-weight:300;font-size:var(--t-display);
  line-height:0.98;letter-spacing:-0.025em;color:var(--fg-1);text-wrap:balance;
}
.m-h1{font-family:var(--font-sans);font-weight:300;font-size:var(--t-h1);line-height:1.04;letter-spacing:-0.02em;color:var(--fg-1);text-wrap:balance;}
.m-h2{font-family:var(--font-sans);font-weight:400;font-size:var(--t-h2);line-height:1.08;letter-spacing:-0.015em;color:var(--fg-1);text-wrap:balance;}
.m-h3{font-family:var(--font-sans);font-weight:500;font-size:var(--t-h3);line-height:1.16;letter-spacing:-0.01em;color:var(--fg-1);}
.m-h4{font-family:var(--font-sans);font-weight:600;font-size:var(--t-h4);line-height:1.25;letter-spacing:-0.005em;color:var(--fg-1);}
.m-lead{font-family:var(--font-sans);font-weight:400;font-size:var(--t-body-lg);line-height:1.55;color:var(--fg-2);}
.m-body{font-family:var(--font-sans);font-weight:400;font-size:var(--t-body);line-height:1.6;color:var(--fg-2);}
.m-small{font-family:var(--font-sans);font-weight:400;font-size:var(--t-sm);line-height:1.5;color:var(--fg-3);}
.m-eyebrow{
  font-family:var(--font-mono);font-weight:500;font-size:var(--t-eyebrow);
  letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);
}
.m-mono{font-family:var(--font-mono);font-weight:400;font-size:var(--t-sm);letter-spacing:-0.01em;color:var(--fg-2);}
.m-stat{font-family:var(--font-sans);font-weight:300;font-size:clamp(44px,5vw,80px);line-height:1;letter-spacing:-0.03em;color:var(--fg-1);}

/* Gradient text helper for the signature accent */
.m-grad-text{
  background:var(--grad-recognition);-webkit-background-clip:text;
  background-clip:text;color:transparent;
}

  </style>
  <style>
/* ============================================================
   FINANCE OS — Console styles
   Built on the Finance OS design tokens (../colors_and_type.css).
   Dark-first, cinematic, engineered as a dense data tool.
   Light ("paper") theme available via [data-theme="light"].
   ============================================================ */

*{box-sizing:border-box;margin:0;padding:0}

:root{
  /* console-scoped semantic surfaces, mapped onto brand tokens */
  --app-bg:var(--ink-900);
  --surface:var(--ink-800);
  --surface-2:var(--ink-700);
  --surface-3:var(--ink-600);
  --hover:var(--ink-500);
  --line-1:var(--line);
  --line-2:var(--line-strong);
  --tx-1:var(--fg-1);
  --tx-2:var(--fg-2);
  --tx-3:var(--fg-3);
  --tx-4:var(--fg-4);

  --agent:#9A6BF0;        /* AI / agent activity */
  --agent-bright:#B79BF7;
  --agent-dim:rgba(154,107,240,0.14);
  --ok:var(--success);
  --warn:var(--warning);
  --bad:var(--danger);

  --accent:var(--indigo);
  --accent-grad:var(--grad-recognition);

  --row-h:52px;          /* table row height (density-driven) */
  --pad:24px;            /* section padding (density-driven) */
  --gap:16px;
}

/* ---------- Light / paper theme ---------- */
[data-theme="light"]{
  --app-bg:#F2EEE7;
  --surface:#FBF9F5;
  --surface-2:#FFFFFF;
  --surface-3:#F6F3EE;
  --hover:#EDE8E0;
  --line-1:rgba(10,10,11,0.10);
  --line-2:rgba(10,10,11,0.16);
  --tx-1:#16161A;
  --tx-2:rgba(10,10,11,0.66);
  --tx-3:rgba(10,10,11,0.46);
  --tx-4:rgba(10,10,11,0.30);
  --agent-dim:rgba(106,69,189,0.10);
  --agent:#6D45C9;
  --agent-bright:#5A36AE;
}

/* density */
[data-density="compact"]{ --row-h:42px; --pad:18px; --gap:12px; }
[data-density="comfy"]{ --row-h:62px; --pad:32px; --gap:22px; }

html,body{
  height:100%;
  font-family:var(--font-sans);
  background:var(--app-bg);
  color:var(--tx-1);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* When switching theme, freeze transitions so var-driven colors jump cleanly
   (avoids a Chromium quirk where color transitions from a changed custom
   property fail to settle). */
.theme-switching *{transition:none !important;}
#root{height:100%;}
.app{display:flex;height:100vh;overflow:hidden;background:var(--app-bg);}

::selection{background:rgba(95,89,255,.32);}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px;}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:3px solid transparent;background-clip:padding-box;}
*::-webkit-scrollbar-thumb:hover{background:var(--tx-4);background-clip:padding-box;}

/* ---------- type helpers ---------- */
.eyebrow{font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3);}
.mono{font-family:var(--font-mono);font-size:12.5px;letter-spacing:-.01em;color:var(--tx-2);}
.tnum{font-variant-numeric:tabular-nums;}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  width:248px;flex:0 0 248px;height:100%;
  background:var(--surface);
  border-right:1px solid var(--line-1);
  display:flex;flex-direction:column;
  transition:width .3s cubic-bezier(.22,.61,.36,1);
}
.sidebar.collapsed{width:74px;flex-basis:74px;}
.sb-brand{display:flex;align-items:center;gap:11px;padding:22px 22px 18px;height:72px;}
.sb-logo{height:19px;width:auto;flex:0 0 auto;}
[data-theme="light"] .sb-logo{filter:invert(1);}
.sb-mark{height:26px;width:26px;border-radius:7px;background:var(--accent-grad);flex:0 0 auto;display:grid;place-items:center;}
.sb-mark svg{width:15px;height:15px;}
.sb-os{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx-3);margin-top:2px;}

.sb-section{padding:14px 16px 6px;}
.sb-section .eyebrow{padding-left:10px;font-size:9.5px;color:var(--tx-4);}
.sidebar.collapsed .sb-section .eyebrow,
.sidebar.collapsed .sb-label,
.sidebar.collapsed .sb-brand .sb-text{opacity:0;pointer-events:none;}

.sb-nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;}
.sb-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;border-radius:var(--r-sm);
  color:var(--tx-2);cursor:pointer;border:1px solid transparent;
  font-size:14px;font-weight:500;position:relative;
  transition:background .18s,color .18s;white-space:nowrap;
}
.sb-item:hover{background:var(--hover);color:var(--tx-1);}
.sb-item.active{background:var(--surface-3);color:var(--tx-1);border-color:var(--line-1);}
.sb-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent-grad);}
.sb-item svg{width:18px;height:18px;flex:0 0 auto;stroke-width:1.6;}
.sb-badge{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--agent-dim);color:var(--agent-bright);}
.sb-badge.warn{background:rgba(240,180,80,.16);color:var(--warn);}

.sb-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line-1);}
.sb-user{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;}
.sb-user:hover{background:var(--hover);}
.sb-ava{height:32px;width:32px;border-radius:50%;flex:0 0 auto;background:var(--accent-grad);display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;}
.sb-uname{font-size:13px;font-weight:600;color:var(--tx-1);line-height:1.2;}
.sb-urole{font-size:11px;color:var(--tx-3);line-height:1.3;}

/* ============================================================
   MAIN COLUMN
   ============================================================ */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;}

.topbar{
  height:72px;flex:0 0 72px;display:flex;align-items:center;gap:18px;
  padding:0 var(--pad);border-bottom:1px solid var(--line-1);
  background:color-mix(in srgb,var(--surface) 72%, transparent);
  backdrop-filter:blur(14px);position:relative;z-index:30;
}
.tb-collapse{height:34px;width:34px;border-radius:var(--r-sm);border:1px solid var(--line-1);background:transparent;color:var(--tx-2);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;}
.tb-collapse:hover{background:var(--hover);color:var(--tx-1);}
.tb-title{display:flex;flex-direction:column;gap:2px;min-width:0;}
.tb-title h1{font-size:19px;font-weight:600;letter-spacing:-.01em;color:var(--tx-1);}
.tb-title .crumb{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--tx-3);}
.tb-search{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--surface-3);border:1px solid var(--line-1);border-radius:var(--r-pill);padding:9px 16px;width:300px;max-width:32vw;color:var(--tx-3);}
.tb-search input{flex:1;background:none;border:none;outline:none;color:var(--tx-1);font-family:var(--font-sans);font-size:13.5px;min-width:0;}
.tb-search input::placeholder{color:var(--tx-4);}
.tb-search kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--tx-3);}
.tb-icon{height:38px;width:38px;border-radius:var(--r-sm);border:1px solid var(--line-1);background:transparent;color:var(--tx-2);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;position:relative;}
.tb-icon:hover{background:var(--hover);color:var(--tx-1);}
.tb-icon .dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface);}

.canvas{flex:1;overflow-y:auto;overflow-x:hidden;}
.page{padding:var(--pad);max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);}
.page-wide{max-width:none;}

/* page header within canvas */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.phead .eyebrow{margin-bottom:8px;}
.phead h2{font-weight:300;font-size:30px;letter-spacing:-.02em;color:var(--tx-1);line-height:1.05;}
.phead p{color:var(--tx-2);font-size:14px;margin-top:7px;max-width:560px;line-height:1.5;}

/* ============================================================
   CARDS / PANELS
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--line-1);border-radius:var(--r-md);}
.card.raised{box-shadow:var(--shadow-md);}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-1);}
.card-h h3{font-size:14px;font-weight:600;color:var(--tx-1);letter-spacing:-.005em;display:flex;align-items:center;gap:9px;}
.card-h h3 svg{width:16px;height:16px;color:var(--tx-3);stroke-width:1.7;}
.card-b{padding:18px;}
.card-link{font-size:12.5px;color:var(--accent);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.card-link:hover{color:var(--agent-bright);}
[data-theme="light"] .card-link{color:#4A44E0;}

.grid{display:grid;gap:var(--gap);}

/* ---------- Metric cards ---------- */
.metric{background:var(--surface);border:1px solid var(--line-1);border-radius:var(--r-md);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .2s;}
.metric:hover{border-color:var(--line-2);}
.metric .m-top{display:flex;align-items:center;justify-content:space-between;}
.metric .m-ico{height:30px;width:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--tx-2);}
.metric .m-ico svg{width:16px;height:16px;stroke-width:1.7;}
.metric .m-lab{font-size:12px;color:var(--tx-3);font-weight:500;letter-spacing:.005em;}
.metric > *{position:relative;z-index:1;}
.metric .m-val{font-weight:300;font-size:34px;letter-spacing:-.03em;line-height:1;color:var(--tx-1);white-space:nowrap;}
.metric .m-val small{font-size:18px;font-weight:400;color:var(--tx-3);letter-spacing:0;}
.metric .m-delta{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:11.5px;font-weight:500;}
.metric .m-delta.up{color:var(--ok);}
.metric .m-delta.down{color:var(--bad);}
.metric .m-delta.flat{color:var(--tx-3);}
.metric .m-delta svg{width:13px;height:13px;}
.metric .m-foot{font-size:11.5px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.metric .spark{position:absolute;right:0;bottom:0;width:110px;height:40px;opacity:.4;pointer-events:none;z-index:0;}

/* ============================================================
   PILLS / BADGES / CHIPS
   ============================================================ */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.005em;border:1px solid transparent;}
.pill .pdot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
.pill.ok{background:rgba(91,201,140,.12);color:var(--ok);}.pill.ok .pdot{background:var(--ok);}
.pill.warn{background:rgba(240,180,80,.13);color:var(--warn);}.pill.warn .pdot{background:var(--warn);}
.pill.bad{background:rgba(242,106,90,.13);color:var(--bad);}.pill.bad .pdot{background:var(--bad);}
.pill.neutral{background:var(--surface-3);color:var(--tx-2);}.pill.neutral .pdot{background:var(--tx-3);}
.pill.agent{background:var(--agent-dim);color:var(--agent-bright);}.pill.agent .pdot{background:var(--agent);}
[data-theme="light"] .pill.agent{color:var(--agent);}

/* agent badge */
.abadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.01em;padding:3px 9px 3px 7px;border-radius:999px;background:var(--agent-dim);color:var(--agent-bright);border:1px solid color-mix(in srgb,var(--agent) 26%,transparent);white-space:nowrap;}
[data-theme="light"] .abadge{color:var(--agent);}
.abadge svg{width:12px;height:12px;flex:0 0 auto;}
.abadge.human{background:var(--surface-3);color:var(--tx-2);border-color:var(--line-1);}

/* source / RAG chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:6px 11px 6px 9px;border-radius:var(--r-sm);background:var(--surface-3);border:1px solid var(--line-1);color:var(--tx-2);cursor:pointer;transition:.18s;}
.chip:hover{border-color:var(--accent);color:var(--tx-1);}
.chip svg{width:13px;height:13px;color:var(--agent);flex:0 0 auto;}
.chip .ctype{font-family:var(--font-mono);font-size:10px;color:var(--tx-4);letter-spacing:.04em;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{font-family:var(--font-sans);font-weight:500;font-size:13.5px;border-radius:var(--r-sm);padding:9px 16px;border:1px solid transparent;cursor:pointer;transition:.2s cubic-bezier(.22,.61,.36,1);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;line-height:1;}
.btn svg{width:15px;height:15px;stroke-width:1.8;}
.btn:active{transform:scale(.98);}
.btn-primary{background:#fff;color:#0A0A0B;}
.btn-primary:hover{background:#e9e9ea;}
[data-theme="light"] .btn-primary{background:var(--ink-900);color:#fff;}
[data-theme="light"] .btn-primary:hover{background:#26262b;}
.btn-grad{background:var(--accent-grad);color:#fff;}
.btn-grad:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--tx-1);border-color:var(--line-2);}
.btn-ghost:hover{background:var(--hover);}
.btn-quiet{background:var(--surface-3);color:var(--tx-1);border-color:var(--line-1);}
.btn-quiet:hover{background:var(--hover);}
.btn-ok{background:rgba(91,201,140,.14);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent);}
.btn-ok:hover{background:rgba(91,201,140,.22);}
.btn-bad{background:rgba(242,106,90,.12);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent);}
.btn-bad:hover{background:rgba(242,106,90,.2);}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:var(--r-xs);}
.btn-block{width:100%;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* ============================================================
   TABLES
   ============================================================ */
.tbl-wrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{
  text-align:left;font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx-4);padding:11px 16px;border-bottom:1px solid var(--line-1);
  white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:2;
}
table.tbl th.num,table.tbl td.num{text-align:right;}
table.tbl td{padding:0 16px;height:var(--row-h);border-bottom:1px solid var(--line-1);color:var(--tx-2);vertical-align:middle;}
table.tbl tbody tr{cursor:pointer;transition:background .14s;}
table.tbl tbody tr:hover{background:var(--hover);}
table.tbl tbody tr.sel{background:var(--surface-3);box-shadow:inset 3px 0 0 var(--accent);}
table.tbl tbody tr:last-child td{border-bottom:none;}
.t-strong{color:var(--tx-1);font-weight:600;}
.t-mono{font-family:var(--font-mono);font-size:12px;color:var(--tx-1);}
.t-amt{font-family:var(--font-mono);font-weight:500;color:var(--tx-1);font-variant-numeric:tabular-nums;}
.t-sub{font-size:11px;color:var(--tx-3);}
.t-vendor{display:flex;align-items:center;gap:10px;}
.t-logo{height:26px;width:26px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--font-mono);font-size:10.5px;font-weight:600;background:var(--surface-3);color:var(--tx-2);border:1px solid var(--line-1);}

/* ============================================================
   CONFIDENCE INDICATOR
   ============================================================ */
.conf{display:inline-flex;align-items:center;gap:9px;}
.conf-ring{position:relative;flex:0 0 auto;}
.conf-ring svg{transform:rotate(-90deg);display:block;}
.conf-ring .cv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;letter-spacing:-.02em;}
.conf-bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative;}
.conf-bar > i{position:absolute;left:0;top:0;height:100%;border-radius:999px;display:block;}
.conf-meta{font-family:var(--font-mono);font-size:11px;color:var(--tx-3);}

/* ============================================================
   DETAIL DRAWER
   ============================================================ */
.drawer-scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
.drawer-scrim.open{opacity:1;pointer-events:auto;}
.drawer{
  position:absolute;top:0;right:0;height:100%;width:min(560px,82vw);
  background:var(--surface);border-left:1px solid var(--line-2);
  box-shadow:var(--shadow-lg);transform:translateX(100%);
  transition:transform .34s cubic-bezier(.22,.61,.36,1);z-index:41;
  display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.drawer-h{flex:0 0 auto;padding:18px 22px;border-bottom:1px solid var(--line-1);display:flex;align-items:flex-start;gap:14px;}
.drawer-h .x{margin-left:auto;height:32px;width:32px;border-radius:var(--r-sm);border:1px solid var(--line-1);background:transparent;color:var(--tx-2);cursor:pointer;display:grid;place-items:center;flex:0 0 auto;}
.drawer-h .x:hover{background:var(--hover);color:var(--tx-1);}
.drawer-b{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:20px;}
.drawer-f{flex:0 0 auto;padding:16px 22px;border-top:1px solid var(--line-1);background:var(--surface-2);display:flex;flex-direction:column;gap:12px;}

.dsec{display:flex;flex-direction:column;gap:11px;}
.dsec > .eyebrow{color:var(--tx-3);}

/* mini definition rows */
.drow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line-1);}
.drow:last-child{border-bottom:none;}
.drow .k{color:var(--tx-3);}
.drow .v{color:var(--tx-1);font-weight:500;text-align:right;}

/* 3-way match */
.match{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:1px;background:var(--line-1);border:1px solid var(--line-1);border-radius:var(--r-sm);overflow:hidden;}
.match .mc{background:var(--surface);padding:11px 12px;display:flex;flex-direction:column;gap:6px;}
.match .mc .mh{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-4);}
.match .mc .mv{font-size:13px;color:var(--tx-1);font-weight:500;font-variant-numeric:tabular-nums;}
.match .mc.mismatch{background:rgba(242,106,90,.08);}
.match .mc.mismatch .mv{color:var(--bad);}
.match-row{display:contents;}

/* reasoning callout */
.reason{background:var(--agent-dim);border:1px solid color-mix(in srgb,var(--agent) 24%,transparent);border-radius:var(--r-sm);padding:14px 15px;display:flex;flex-direction:column;gap:9px;}
.reason .rh{display:flex;align-items:center;gap:8px;}
.reason p{font-size:13px;line-height:1.55;color:var(--tx-1);}
.reason .rq{color:var(--tx-2);}

.audit-note{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx-3);font-family:var(--font-mono);letter-spacing:.01em;}
.audit-note svg{width:13px;height:13px;color:var(--ok);flex:0 0 auto;}

/* line-item table inside drawer */
.li{width:100%;border-collapse:collapse;font-size:12.5px;}
.li th{text-align:left;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-4);padding:6px 0;border-bottom:1px solid var(--line-1);}
.li th.num,.li td.num{text-align:right;font-variant-numeric:tabular-nums;}
.li td{padding:8px 0;border-bottom:1px solid var(--line-1);color:var(--tx-2);}
.li tr:last-child td{border-bottom:none;}
.li .flag{color:var(--bad);}

/* ============================================================
   FEED
   ============================================================ */
.feed{display:flex;flex-direction:column;}
.feed-item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-1);}
.feed-item:last-child{border-bottom:none;}
.feed-ico{height:30px;width:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;margin-top:1px;}
.feed-ico svg{width:15px;height:15px;stroke-width:1.8;}
.fi-agent{background:var(--agent-dim);color:var(--agent-bright);}
.fi-ok{background:rgba(91,201,140,.12);color:var(--ok);}
.fi-warn{background:rgba(240,180,80,.13);color:var(--warn);}
.fi-bad{background:rgba(242,106,90,.12);color:var(--bad);}
.feed-body{flex:1;min-width:0;}
.feed-body p{font-size:13px;line-height:1.5;color:var(--tx-1);}
.feed-body p b{font-weight:600;}
.feed-body .amt{font-family:var(--font-mono);font-weight:500;}
.feed-meta{display:flex;align-items:center;gap:10px;margin-top:5px;}
.feed-time{font-family:var(--font-mono);font-size:10.5px;color:var(--tx-4);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(91,201,140,.6);animation:pulse 2.4s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,201,140,.5);}70%{box-shadow:0 0 0 7px rgba(91,201,140,0);}100%{box-shadow:0 0 0 0 rgba(91,201,140,0);}}

/* ============================================================
   TABS
   ============================================================ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-1);}
.tab{padding:11px 16px;font-size:13.5px;font-weight:500;color:var(--tx-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.18s;display:flex;align-items:center;gap:8px;}
.tab:hover{color:var(--tx-1);}
.tab.active{color:var(--tx-1);border-bottom-color:var(--accent);}
.tab .tcount{font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--surface-3);color:var(--tx-3);}

/* ============================================================
   BANNERS / ALERTS
   ============================================================ */
.banner{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:var(--r-md);border:1px solid transparent;}
.banner svg{flex:0 0 auto;}
.banner .bt{flex:1;}
.banner .bt h4{font-size:14px;font-weight:600;color:var(--tx-1);}
.banner .bt p{font-size:12.5px;color:var(--tx-2);margin-top:2px;}
.banner.warn{background:rgba(240,180,80,.09);border-color:color-mix(in srgb,var(--warn) 30%,transparent);}
.banner.warn svg{color:var(--warn);}
.banner.bad{background:rgba(242,106,90,.08);border-color:color-mix(in srgb,var(--bad) 28%,transparent);}
.banner.bad svg{color:var(--bad);}

/* alert cards (anomalies) */
.alert{background:var(--surface);border:1px solid var(--line-1);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:13px;border-left:3px solid var(--line-2);}
.alert.sev-high{border-left-color:var(--bad);}
.alert.sev-med{border-left-color:var(--warn);}
.alert.sev-low{border-left-color:var(--accent);}
.alert-top{display:flex;align-items:flex-start;gap:12px;}
.alert-ico{height:38px;width:38px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;background:var(--surface-3);}
.alert-ico svg{width:19px;height:19px;}
.alert h4{font-size:15px;font-weight:600;color:var(--tx-1);}
.alert .asub{font-size:12.5px;color:var(--tx-2);margin-top:3px;line-height:1.5;}
.alert-risk{margin-left:auto;text-align:right;flex:0 0 auto;}
.alert-risk .ar-val{font-family:var(--font-mono);font-weight:600;font-size:18px;color:var(--bad);letter-spacing:-.02em;}
.alert-risk .ar-lab{font-size:10px;color:var(--tx-4);font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;}
.alert-foot{display:flex;align-items:center;gap:10px;padding-top:3px;}

/* ============================================================
   SLIDERS (threshold controls)
   ============================================================ */
.thresh{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-bottom:1px solid var(--line-1);}
.thresh:last-child{border-bottom:none;}
.thresh-top{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.thresh-top .tl{display:flex;align-items:center;gap:10px;}
.thresh-name{font-size:13.5px;font-weight:600;color:var(--tx-1);}
.thresh-val{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--accent);}
[data-theme="light"] .thresh-val{color:#4A44E0;}
.thresh-track{position:relative;height:30px;display:flex;align-items:center;cursor:pointer;}
.thresh-rail{position:absolute;left:0;right:0;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.thresh-rail > i{position:absolute;left:0;top:0;height:100%;background:var(--accent-grad);border-radius:999px;}
.thresh-knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);transform:translate(-50%,-50%);box-shadow:var(--shadow-sm);}
.thresh-zones{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx-4);font-family:var(--font-mono);margin-top:2px;}
.thresh-note{font-size:11.5px;color:var(--tx-3);display:flex;align-items:center;gap:7px;}

/* ============================================================
   CHARTS (hand-built)
   ============================================================ */
.chart{width:100%;display:block;overflow:visible;}
.legend{display:flex;gap:18px;flex-wrap:wrap;}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx-2);}
.legend .lg i{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
.legend .lg.line i{height:3px;width:16px;border-radius:2px;}

.donut-wrap{display:flex;align-items:center;gap:24px;}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
.donut-center .dc-val{font-weight:300;font-size:26px;letter-spacing:-.02em;color:var(--tx-1);line-height:1;}
.donut-center .dc-lab{font-size:10.5px;color:var(--tx-3);font-family:var(--font-mono);margin-top:3px;}

/* ============================================================
   TOASTS
   ============================================================ */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;}
.toast{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-md);padding:13px 18px;box-shadow:var(--shadow-lg);min-width:300px;max-width:440px;animation:toastin .3s cubic-bezier(.22,.61,.36,1);}
[data-theme="dark"] .toast{background:#1b1b1f;}
.toast .ti{height:30px;width:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;}
.toast .tx h5{font-size:13.5px;font-weight:600;color:var(--tx-1);}
.toast .tx p{font-size:11.5px;color:var(--tx-3);margin-top:1px;}
@keyframes toastin{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* utility */
.spread{display:flex;align-items:center;justify-content:space-between;gap:14px;}
.vstack{display:flex;flex-direction:column;}
.hstack{display:flex;align-items:center;}
.muted{color:var(--tx-3);}
.divider{height:1px;background:var(--line-1);border:none;width:100%;}
.empty{padding:48px 20px;text-align:center;color:var(--tx-3);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.empty svg{width:34px;height:34px;color:var(--tx-4);}

/* responsive */
@media (max-width:1100px){
  .tb-search{width:200px;}
}
@media (max-width:820px){
  .sidebar{position:absolute;z-index:60;height:100%;box-shadow:var(--shadow-lg);}
}

  </style>

  <script type="text/babel">
/* Finance OS — shared signature components.
   ConfidenceRing/Bar, AgentBadge, SourceChip, StatusPill, MetricCard, charts. */
(function () {
  const { useState, useMemo } = React;
  const Icon = window.Icon;

  // confidence -> color
  function confColor(c) {
    if (c >= 80) return "var(--ok)";
    if (c >= 60) return "var(--warn)";
    return "var(--bad)";
  }

  // ---------- Confidence ring ----------
  function ConfidenceRing({ value, size = 46, stroke = 4, showLabel = true }) {
    const r = (size - stroke) / 2;
    const circ = 2 * Math.PI * r;
    const off = circ * (1 - value / 100);
    const col = confColor(value);
    return (
      <div className="conf-ring" style={{ width: size, height: size }}>
        <svg width={size} height={size}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--surface-3)" strokeWidth={stroke} />
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={stroke}
            strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"
            style={{ transition: "stroke-dashoffset .6s cubic-bezier(.22,.61,.36,1)" }} />
        </svg>
        {showLabel && (
          <div className="cv" style={{ color: col, fontSize: size * 0.27 }}>{value}</div>
        )}
      </div>
    );
  }

  // ---------- Confidence bar ----------
  function ConfidenceBar({ value, width = 70, showVal = true }) {
    const col = confColor(value);
    return (
      <div className="conf">
        <div className="conf-bar" style={{ width }}>
          <i style={{ width: value + "%", background: col, transition: "width .6s cubic-bezier(.22,.61,.36,1)" }} />
        </div>
        {showVal && <span className="mono tnum" style={{ color: col, fontWeight: 600 }}>{value}%</span>}
      </div>
    );
  }

  // ---------- Agent badge ----------
  function AgentBadge({ agent, human = false, icon = "sparkle", small = false }) {
    if (human) {
      return (
        <span className="abadge human" style={small ? { fontSize: 9.5, padding: "2px 7px 2px 6px" } : null}>
          <Icon name="users" size={11} />{agent}
        </span>
      );
    }
    return (
      <span className="abadge" style={small ? { fontSize: 9.5, padding: "2px 7px 2px 6px" } : null}>
        <Icon name={icon} size={11} />{agent}
      </span>
    );
  }

  // ---------- Source / RAG chip ----------
  function SourceChip({ type, refId, note, onClick }) {
    return (
      <span className="chip" onClick={onClick} title={note}>
        <Icon name={type === "Invoice" ? "receipt" : type === "Policy" ? "scale" : type === "PO" ? "fileText" : type === "Contract" || type === "Lease" ? "file" : "link"} />
        <span><span className="ctype">{type}</span> {refId}</span>
      </span>
    );
  }

  // ---------- Status pill ----------
  function StatusPill({ tone = "neutral", children, dot = true }) {
    return (
      <span className={"pill " + tone}>
        {dot && <span className="pdot" />}
        {children}
      </span>
    );
  }

  // ---------- Sparkline ----------
  function Sparkline({ data, w = 120, h = 46, color = "var(--ok)", fill = true }) {
    const { path, area } = useMemo(() => {
      const min = Math.min(...data), max = Math.max(...data);
      const span = max - min || 1;
      const pts = data.map((v, i) => {
        const x = (i / (data.length - 1)) * w;
        const y = h - 4 - ((v - min) / span) * (h - 8);
        return [x, y];
      });
      const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = path + ` L${w} ${h} L0 ${h} Z`;
      return { path, area };
    }, [data, w, h]);
    const gid = useMemo(() => "sg" + Math.random().toString(36).slice(2, 7), []);
    return (
      <svg className="spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: w, height: h }}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.28" />
            <stop offset="100%" stopColor={color} stopOpacity="0" />
          </linearGradient>
        </defs>
        {fill && <path d={area} fill={`url(#${gid})`} />}
        <path d={path} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    );
  }

  // ---------- Line chart (multi-series) ----------
  function LineChart({ series, labels, h = 240, yFmt = (v) => v, yMax, yMin }) {
    const pad = { l: 44, r: 16, t: 16, b: 28 };
    const w = 760;
    const all = series.flatMap((s) => s.data);
    const max = yMax != null ? yMax : Math.max(...all) * 1.12;
    const min = yMin != null ? yMin : Math.min(0, ...all);
    const span = max - min || 1;
    const innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
    const X = (i, n) => pad.l + (i / (n - 1)) * innerW;
    const Y = (v) => pad.t + innerH - ((v - min) / span) * innerH;
    const ticks = 4;
    return (
      <svg className="chart" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet">
        {Array.from({ length: ticks + 1 }).map((_, i) => {
          const v = min + (span * i) / ticks;
          const y = Y(v);
          return (
            <g key={i}>
              <line x1={pad.l} y1={y} x2={w - pad.r} y2={y} stroke="var(--line-1)" strokeWidth="1" />
              <text x={pad.l - 10} y={y + 3.5} textAnchor="end" fontSize="10" fontFamily="var(--font-mono)" fill="var(--tx-4)">{yFmt(v)}</text>
            </g>
          );
        })}
        {labels.map((lb, i) => (
          <text key={i} x={X(i, labels.length)} y={h - 8} textAnchor="middle" fontSize="10" fontFamily="var(--font-mono)" fill="var(--tx-4)">{lb}</text>
        ))}
        {series.map((s, si) => {
          const pts = s.data.map((v, i) => [X(i, s.data.length), Y(v)]);
          const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
          const gid = "lc" + si + Math.round(X(0, 2));
          return (
            <g key={si}>
              {s.fill && (
                <>
                  <defs>
                    <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor={s.color} stopOpacity="0.22" />
                      <stop offset="100%" stopColor={s.color} stopOpacity="0" />
                    </linearGradient>
                  </defs>
                  <path d={d + ` L${pts[pts.length-1][0]} ${pad.t+innerH} L${pts[0][0]} ${pad.t+innerH} Z`} fill={`url(#${gid})`} />
                </>
              )}
              <path d={d} fill="none" stroke={s.color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" strokeDasharray={s.dashed ? "5 5" : "none"} />
              {s.dots !== false && pts.map((p, i) => (
                <circle key={i} cx={p[0]} cy={p[1]} r="3" fill="var(--surface)" stroke={s.color} strokeWidth="2" />
              ))}
            </g>
          );
        })}
      </svg>
    );
  }

  // ---------- Bar chart ----------
  function BarChart({ data, labels, h = 220, color = "var(--accent)", yFmt = (v) => v }) {
    const pad = { l: 44, r: 12, t: 14, b: 28 };
    const w = 760;
    const max = Math.max(...data) * 1.12;
    const innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
    const bw = (innerW / data.length) * 0.56;
    const gap = (innerW / data.length);
    const ticks = 4;
    return (
      <svg className="chart" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet">
        {Array.from({ length: ticks + 1 }).map((_, i) => {
          const v = (max * i) / ticks;
          const y = pad.t + innerH - (v / max) * innerH;
          return (
            <g key={i}>
              <line x1={pad.l} y1={y} x2={w - pad.r} y2={y} stroke="var(--line-1)" strokeWidth="1" />
              <text x={pad.l - 10} y={y + 3.5} textAnchor="end" fontSize="10" fontFamily="var(--font-mono)" fill="var(--tx-4)">{yFmt(v)}</text>
            </g>
          );
        })}
        {data.map((v, i) => {
          const bh = (v / max) * innerH;
          const x = pad.l + i * gap + (gap - bw) / 2;
          const y = pad.t + innerH - bh;
          return (
            <g key={i}>
              <rect x={x} y={y} width={bw} height={bh} rx="4" fill={typeof color === "function" ? color(v, i) : color} opacity="0.9" />
              <text x={x + bw / 2} y={h - 8} textAnchor="middle" fontSize="10" fontFamily="var(--font-mono)" fill="var(--tx-4)">{labels[i]}</text>
            </g>
          );
        })}
      </svg>
    );
  }

  // ---------- Donut ----------
  function Donut({ data, size = 150, stroke = 22, centerVal, centerLab }) {
    const r = (size - stroke) / 2;
    const circ = 2 * Math.PI * r;
    const total = data.reduce((a, d) => a + d.value, 0);
    let acc = 0;
    return (
      <div style={{ position: "relative", width: size, height: size, flex: "0 0 auto" }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--surface-3)" strokeWidth={stroke} />
          {data.map((d, i) => {
            const frac = d.value / total;
            const dash = frac * circ;
            const el = (
              <circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={stroke}
                strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={-acc * circ}
                style={{ transition: "stroke-dashoffset .6s" }} />
            );
            acc += frac;
            return el;
          })}
        </svg>
        <div className="donut-center">
          <div>
            <div className="dc-val">{centerVal}</div>
            <div className="dc-lab">{centerLab}</div>
          </div>
        </div>
      </div>
    );
  }

  // ---------- Metric card ----------
  function MetricCard({ m }) {
    const dirIcon = m.dir === "up" ? "arrowUp" : m.dir === "down" ? "arrowDown" : "minus";
    const sparkColor = m.tone === "ok" ? "var(--ok)" : m.tone === "warn" ? "var(--warn)" : "var(--accent)";
    return (
      <div className="metric">
        <div className="m-top">
          <span className="m-lab">{m.label}</span>
          <span className="m-ico"><Icon name={m.icon} size={15} /></span>
        </div>
        <div className="m-val tnum">{m.value}{m.suffix && <small>{m.suffix}</small>}</div>
        <div className="hstack" style={{ gap: 10 }}>
          <span className={"m-delta " + m.dir}><Icon name={dirIcon} size={12} />{m.delta}</span>
          <span className="m-foot">{m.foot}</span>
        </div>
        <Sparkline data={m.spark} color={sparkColor} />
      </div>
    );
  }

  Object.assign(window, {
    ConfidenceRing, ConfidenceBar, AgentBadge, SourceChip, StatusPill,
    Sparkline, LineChart, BarChart, Donut, MetricCard, confColor,
  });
})();

  </script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

(function () {
  const { useState, useRef, useEffect } = React;
  const Icon = window.Icon;

  function Audit({ showSignature, toast }) {
    const M = window.MOCK;
    const [outcome, setOutcome] = useState("all");
    const rows = M.audit.filter((r) => outcome === "all" ? true : r.outcome === outcome);
    const [thresholds, setThresholds] = useState(M.thresholds.map((t) => t.value));

    return (
      <div className="page page-wide">
        <div className="grid" style={{ gridTemplateColumns: "1.55fr 1fr", alignItems: "start" }}>
          {/* Audit log */}
          <div className="card" style={{ overflow: "hidden" }}>
            <div className="card-h">
              <h3><Icon name="activity" /> Agent Decision Log</h3>
              <div className="hstack" style={{ gap: 4 }}>
                {[["all","All"],["auto","Auto"],["escalated","Escalated"],["overridden","Overridden"]].map(([k, lbl]) => (
                  <span key={k} className={"tab" + (outcome === k ? " active" : "")} onClick={() => setOutcome(k)} style={{ padding: "5px 10px", fontSize: 12, marginBottom: 0, borderBottom: "none", borderRadius: 8, background: outcome === k ? "var(--surface-3)" : "transparent" }}>{lbl}</span>
                ))}
              </div>
            </div>
            <div className="tbl-wrap">
              <table className="tbl">
                <thead><tr><th>Time</th><th>Agent</th><th>Action</th><th>Conf.</th><th>Outcome</th><th>Source</th></tr></thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={i} style={{ cursor: "default" }}>
                      <td><span className="mono" style={{ fontSize: 11.5 }}>{r.time}</span></td>
                      <td>{showSignature ? <window.AgentBadge agent={r.agent.replace(" Agent", "")} small /> : <span className="t-sub">{r.agent}</span>}</td>
                      <td><span style={{ color: "var(--tx-1)" }}>{r.action}</span>{r.by && <div className="t-sub">by {r.by}</div>}</td>
                      <td><span className="t-amt" style={{ color: window.confColor(r.conf) }}>{r.conf}%</span></td>
                      <td>
                        <window.StatusPill tone={r.outcome === "auto" ? "ok" : r.outcome === "escalated" ? "warn" : "agent"}>
                          {r.outcome === "auto" ? "Auto-executed" : r.outcome === "escalated" ? "Escalated" : "Overridden"}
                        </window.StatusPill>
                      </td>
                      <td><span className="mono" style={{ fontSize: 11, color: "var(--tx-3)" }}>{r.src}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="card-h" style={{ borderTop: "1px solid var(--line-1)", borderBottom: "none", justifyContent: "center" }}>
              <span className="audit-note"><Icon name="lock" size={13} /> Immutable SOX log · 7-year retention · exportable for audit</span>
            </div>
          </div>

          {/* Threshold controls */}
          <div className="card">
            <div className="card-h">
              <h3><Icon name="sliders" /> Confidence Thresholds</h3>
              <window.StatusPill tone="agent" dot={false}>Co-owned w/ Controller</window.StatusPill>
            </div>
            <div className="card-b">
              <p className="t-sub" style={{ marginBottom: 6, lineHeight: 1.5 }}>Above the threshold, the agent auto-executes. Below it, the item routes here for human review.</p>
              {M.thresholds.map((t, i) => (
                <ThreshSlider key={i} name={t.agent} desc={t.desc} value={thresholds[i]}
                  onChange={(v) => setThresholds((arr) => arr.map((x, j) => j === i ? v : x))}
                  onCommit={(v) => toast("Threshold updated", t.agent + " auto-approve ≥ " + v + "% · logged")} />
              ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  function ThreshSlider({ name, desc, value, onChange, onCommit }) {
    const trackRef = useRef(null);
    const draggingRef = useRef(false);

    function setFromClientX(clientX) {
      const el = trackRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      let pct = Math.round(((clientX - rect.left) / rect.width) * 100);
      pct = Math.max(50, Math.min(99, pct));
      onChange(pct);
      return pct;
    }
    function down(e) {
      draggingRef.current = true;
      setFromClientX(e.clientX ?? (e.touches && e.touches[0].clientX));
      e.preventDefault();
    }
    useEffect(() => {
      function move(e) { if (draggingRef.current) setFromClientX(e.clientX ?? (e.touches && e.touches[0].clientX)); }
      function up() { if (draggingRef.current) { draggingRef.current = false; onCommit && onCommit(value); } }
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      window.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("touchend", up);
      return () => {
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
        window.removeEventListener("touchmove", move);
        window.removeEventListener("touchend", up);
      };
    }, [value]);

    return (
      <div className="thresh">
        <div className="thresh-top">
          <div className="tl">
            <span className="thresh-name">{name}</span>
          </div>
          <span className="thresh-val tnum">≥ {value}%</span>
        </div>
        <span className="t-sub" style={{ marginTop: -2 }}>{desc}</span>
        <div className="thresh-track" ref={trackRef} onMouseDown={down} onTouchStart={down}>
          <div className="thresh-rail"><i style={{ width: value + "%" }} /></div>
          <div className="thresh-knob" style={{ left: value + "%" }} />
        </div>
        <div className="thresh-zones"><span>Review ↤ 50</span><span>↦ auto-execute 99</span></div>
      </div>
    );
  }

  window.Audit = Audit;
})();

  </script>

              <div className="hstack" style={{ alignItems: "baseline", gap: 10, marginBottom: 10 }}>
                <span style={{ fontWeight: 300, fontSize: 40, letterSpacing: "-.03em", color: "var(--tx-1)" }} className="tnum">{c.fmt(c.data[c.data.length - 1])}</span>
                <span className="mono" style={{ color: c.color }}>{c.label} · trailing 12 mo</span>
              </div>
              <window.LineChart labels={A.months} yFmt={c.fmt} series={[{ data: c.data, color: c.color, fill: true }]} h={260} />
            </div>
          </div>

          {/* override rate bar */}
          <div className="card">
            <div className="card-h">
              <h3><Icon name="users" /> Human Override Rate</h3>
              <span className="eyebrow">Lower is better</span>
            </div>
            <div className="card-b">
              <div className="hstack" style={{ alignItems: "baseline", gap: 10, marginBottom: 10 }}>
                <span style={{ fontWeight: 300, fontSize: 40, letterSpacing: "-.03em", color: "var(--ok)" }} className="tnum">4.6%</span>
                <span className="mono" style={{ color: "var(--ok)" }}>−7.4 pts YoY</span>
              </div>
              <window.BarChart data={A.overrideRate} labels={A.months} yFmt={(v) => v.toFixed(0) + "%"} h={260}
                color={(v) => v > 8 ? "var(--warn)" : "var(--ok)"} />
              <p className="t-sub" style={{ marginTop: 10, lineHeight: 1.5 }}>As agents earn trust, humans override fewer decisions — the program's core trust signal.</p>
            </div>
          </div>
        </div>

        <div className="banner" style={{ background: "var(--agent-dim)", borderColor: "color-mix(in srgb,var(--agent) 24%,transparent)" }}>
          <Icon name="sparkle2" size={22} style={{ color: "var(--agent-bright)" }} />
          <div className="bt">
            <h4>The human's job has shifted from data entry to governance</h4>
            <p>82% of invoices now process untouched. The team's time goes to the 18% that need judgment — and to tuning the agents that handle the rest.</p>
          </div>
        </div>
      </div>
    );
  }

  window.Analytics = Analytics;
})();

  </script>
  <script type="text/babel">
/* Finance OS — root app, routing, state, toasts, tweaks. */
(function () {
  const { useState, useEffect, useCallback } = React;
  const Icon = window.Icon;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "dark",
    "accent": ["#FF8861", "#9A6BF0", "#5F59FF"],
    "density": "regular",
    "font": "Hanken Grotesk",
    "showSignature": true,
    "liveFeed": true
  }/*EDITMODE-END*/;

  const RESOLVE_COPY = {
    approved: ["Approved", "logged to audit trail"],
    rejected: ["Rejected", "vendor notified · logged"],
    adjusted: ["Adjusted & approved", "delta posted · logged"],
    clarify: ["Clarification requested", "sent to vendor portal"],
    escalated: ["Escalated", "routed to Controller"],
  };

  function App() {
    const [t, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
    const [view, setView] = useState("dashboard");
    const [collapsed, setCollapsed] = useState(false);
    const [toasts, setToasts] = useState([]);

    // exception queue state (so approve/reject removes rows)
    const [exceptions, setExceptions] = useState(window.MOCK.exceptions);
    const [selectedEx, setSelectedEx] = useState(null);
    // canonical org-wide open-exception count (table shows the priority subset)
    const [openCount, setOpenCount] = useState(47);

    const dark = t.theme !== "light";

    // apply theme/density/accent/font to :root
    useEffect(() => {
      const root = document.documentElement;
      root.classList.add("theme-switching");
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.setAttribute("data-density", t.density || "regular");
      const acc = Array.isArray(t.accent) ? t.accent : ["#FF8861", "#9A6BF0", "#5F59FF"];
      root.style.setProperty("--coral", acc[0]);
      root.style.setProperty("--violet", acc[1] || acc[0]);
      root.style.setProperty("--indigo", acc[2] || acc[1] || acc[0]);
      root.style.setProperty("--accent", acc[2] || acc[1] || acc[0]);
      root.style.setProperty("--agent", acc[1] || acc[0]);
      root.style.setProperty("--grad-recognition", `linear-gradient(135deg,${acc[0]} 0%,${acc[1]||acc[0]} 52%,${acc[2]||acc[1]||acc[0]} 100%)`);
      root.style.setProperty("--accent-grad", `linear-gradient(135deg,${acc[0]} 0%,${acc[1]||acc[0]} 52%,${acc[2]||acc[1]||acc[0]} 100%)`);
      root.style.setProperty("--font-sans", `"${t.font}",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`);
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("theme-switching")));
    }, [dark, t.density, t.accent, t.font]);

    const toast = useCallback((title, sub, tone = "ok") => {
      const id = Date.now() + Math.random();
      setToasts((arr) => [...arr, { id, title, sub, tone }]);
      setTimeout(() => setToasts((arr) => arr.filter((x) => x.id !== id)), 4200);
    }, []);

    const openException = useCallback((id) => {
      setView("exceptions");
      setSelectedEx(id);
    }, []);

    const resolveException = useCallback((id, kind) => {
      const ex = exceptions.find((e) => e.id === id);
      setSelectedEx(null);
      setOpenCount((c) => Math.max(0, c - 1));
      setTimeout(() => {
        setExceptions((arr) => arr.filter((e) => e.id !== id));
      }, 280);
      const [title, sub] = RESOLVE_COPY[kind] || ["Done", "logged"];
      toast(title + " · " + (ex ? ex.id : ""), (ex ? ex.amountStr + " · " : "") + sub);
    }, [exceptions, toast]);

    const screen = (() => {
      switch (view) {
        case "dashboard": return <window.Dashboard onNav={setView} onOpenException={openException} showSignature={t.showSignature} openCount={openCount} key="dash" />;
        case "exceptions": return <window.Exceptions rows={exceptions} selectedId={selectedEx} onSelect={setSelectedEx} onResolve={resolveException} showSignature={t.showSignature} openCount={openCount} toast={toast} key="exc" />;
        case "cash": return <window.CashApplication showSignature={t.showSignature} toast={toast} key="cash" />;
        case "collections": return <window.Collections showSignature={t.showSignature} key="coll" />;
        case "anomalies": return <window.Anomalies showSignature={t.showSignature} toast={toast} key="anom" />;
        case "audit": return <window.Audit showSignature={t.showSignature} toast={toast} key="audit" />;
        case "analytics": return <window.Analytics key="ana" />;
        default: return null;
      }
    })();

    // screens that own their own scroll/drawer container
    const selfScroll = view === "exceptions" || view === "cash";

    return (
      <div className="app">
        <window.Sidebar active={view} onNav={(v) => { setView(v); }} collapsed={collapsed} openCount={openCount} />
        <div className="main">
          <window.TopBar view={view} onCollapse={() => setCollapsed((c) => !c)} dark={dark} onToggleTheme={() => setTweak("theme", dark ? "light" : "dark")} />
          {selfScroll ? (
            <div style={{ flex: 1, minHeight: 0, position: "relative" }} data-screen-label={view}>{screen}</div>
          ) : (
            <div className="canvas" data-screen-label={view}>{screen}</div>
          )}
        </div>

        {/* Toasts */}
        <div className="toasts">
          {toasts.map((to) => (
            <div className="toast" key={to.id}>
              <div className="ti" style={{ background: to.tone === "ok" ? "rgba(91,201,140,.14)" : "var(--agent-dim)", color: to.tone === "ok" ? "var(--ok)" : "var(--agent-bright)" }}>
                <Icon name={to.tone === "ok" ? "checkCircle" : "sparkle"} size={16} />
              </div>
              <div className="tx">
                <h5>{to.title}</h5>
                <p>{to.sub}</p>
              </div>
            </div>
          ))}
        </div>

        {/* Tweaks */}
        <window.TweaksPanel>
          <window.TweakSection label="Appearance" />
          <window.TweakRadio label="Theme" value={t.theme} options={["dark", "light"]} onChange={(v) => setTweak("theme", v)} />
          <window.TweakRadio label="Density" value={t.density} options={["compact", "regular", "comfy"]} onChange={(v) => setTweak("density", v)} />
          <window.TweakColor label="Accent (Recognition)" value={t.accent}
            options={[["#FF8861", "#9A6BF0", "#5F59FF"], ["#5BC98C", "#3FA7A0", "#2E75B6"], ["#F0B450", "#E8836A", "#C0392B"], ["#7CA8FF", "#9A6BF0", "#C06BE0"]]}
            onChange={(v) => setTweak("accent", v)} />
          <window.TweakSelect label="Font" value={t.font} options={["Hanken Grotesk", "Geist Mono", "system-ui"]} onChange={(v) => setTweak("font", v)} />
          <window.TweakSection label="Agentic signature" />
          <window.TweakToggle label="Confidence rings & agent badges" value={t.showSignature} onChange={(v) => setTweak("showSignature", v)} />
        </window.TweaksPanel>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
})();

  </script>
</body>
