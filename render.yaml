# Render Blueprint — one free web service that serves the API and the SPA.
# Deploy: push to GitHub, then Render > New > Blueprint and pick this repo.
services:
  - type: web
    name: financeos-apar
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # LLM_PROVIDER unset => offline deterministic narrator (no key, no GPU).
      # To enable live AI explanations on a hosted model instead, uncomment:
      # - key: LLM_PROVIDER
      #   value: anthropic
      # - key: LLM_API_KEY
      #   sync: false            # set the secret in the Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
